name: Build and test
on:
  push:
    paths:
      - 'NLA_CHECKER/**'
      - 'tests/**'
      - 'scripts/**'
      - 'NLA_CHECKER.sln'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Release and run regression tests
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Package portable application
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NLA-Checker-windows
          path: |
            artifacts/NLA-Checker-v*-windows.zip
            artifacts/SHA256SUMS.txt
