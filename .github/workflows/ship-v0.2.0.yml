name: Publish verified v0.2.0 update
on:
  push:
    paths: ['.github/workflows/ship-v0.2.0.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v0.2.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'unknown-killer/NLA-Checker' && github.ref == 'refs/heads/NLA-Checker'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore reviewed source snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --quiet 196c37e71e4b88e86a25230d998b9a5d71c189aa HEAD -- . ':(exclude).github/workflows/*'
          if ($LASTEXITCODE -ne 0) { throw 'Repository source changed since review; refusing to overwrite it.' }
          $encoded = ''
          $archive = Join-Path $env:RUNNER_TEMP 'nla-v0.2.0.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash $archive).Hash -ne 'C0BC8B35D094491985EF92A68ED4E520B2D1835271797259F08D76142C4D6415') { throw 'Source archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:GITHUB_WORKSPACE -Force
          git checkout -- .github/workflows/build.yml
          $obsolete = @('NLA_CHECKER/FodyWeavers.xml','NLA_CHECKER/Form1.Designer.cs','NLA_CHECKER/Form1.resx','NLA_CHECKER/Properties/Resources.Designer.cs','NLA_CHECKER/Properties/Resources.resx','NLA_CHECKER/Properties/Settings.Designer.cs','NLA_CHECKER/Properties/Settings.settings','NLA_CHECKER/ThreadGunuk.cs','NLA_CHECKER/packages.config')
          foreach ($file in $obsolete) { Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $file) }
      - name: Build and verify before publishing
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/package.ps1
      - name: Commit reviewed source and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'unknown-killer'
          git config user.email '34870306+unknown-killer@users.noreply.github.com'
          git add --all
          git commit -m 'Fix NLA classification, cancellation and async scan performance' -m 'Correct output mapping and counters, keep interrupted targets, remove external UI dependencies, and add tests plus Persian/English documentation.'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed.' }
          git push origin HEAD:NLA-Checker
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed.' }
          $commit = git rev-parse HEAD
          gh release create v0.2.0 'artifacts/NLA-Checker-v0.2.0-windows.zip' 'artifacts/SHA256SUMS.txt' --target $commit --title 'NLA Checker 0.2.0 — corrected results and stable async checks' --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
